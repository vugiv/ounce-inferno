<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151c20">
<title>Bounce Inferno � Limbo</title>
<style>
:root{color-scheme:dark;font-family:Georgia,'Times New Roman',serif;background:#141c1f;color:#f5e9c8}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,#343e40,#141c1f 68%)}
main{width:min(95vw,calc((100svh - 39px) * .75),495px)}.viewport{position:relative;overflow:hidden;border-radius:4px;border:1px solid #a49b7b65;background:#556975;box-shadow:0 18px 76px #080c11a8}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;outline-offset:-2px;touch-action:none}
.keys{display:flex;align-items:center;justify-content:space-between;min-height:32px;gap:8px;padding:4px 2px 0;font:11px system-ui,sans-serif;letter-spacing:.02em;color:#c9c8b6}
button{background:#253034;border:1px solid #aaa88c62;border-radius:4px;color:inherit;cursor:pointer;font:inherit;padding:3px 7px}
button:hover,button:focus-visible{background:#43524c}button:focus-visible,canvas:focus-visible{outline:2px solid #f5d99b}
.touch{display:none;position:absolute;bottom:8px;inset-inline:8px;justify-content:space-between;pointer-events:none;color:#fff4d8}
.touch button{pointer-events:auto;min-width:44px;min-height:44px;touch-action:none;user-select:none;font:600 18px system-ui,sans-serif;background:#232c34cf}
.touch button+button{margin-left:4px}
@media(pointer:coarse){.touch{display:flex}.keys .kbd{display:none}}
</style>
</head>
<body>
<main>
  <div class="viewport">
    <canvas id="game" width="720" height="960" tabindex="0" aria-label="Bounce Inferno, Limbo. Left and right roll. Space jumps, down drops through ledges, and R restarts."></canvas>
    <div class="touch" aria-label="Touch controls">
      <div><button type="button" data-key="ArrowLeft" aria-label="Roll left"></button><button type="button" data-key="ArrowRight" aria-label="Roll right"></button></div>
      <button type="button" data-key="Space" aria-label="Jump"></button>
    </div>
  </div>
  <div class="keys"><span id="location">I � Limbo</span><span class="kbd">  Roll � Space Jump</span><button type="button" id="restart">Restart</button></div>
</main>
<script type="module">
import("./game.js").catch(error => {
  console.error(error);
  document.getElementById("location").textContent = "Could not load Limbo. Reload the page.";
});
</script>
</body>
</html>
