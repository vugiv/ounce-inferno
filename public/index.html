<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151c20">
<title>Bounce Inferno · Limbo</title>
<style>
:root{color-scheme:dark;font-family:Georgia,'Times New Roman',serif;background:#141c1f;color:#f5e9c8}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,#343e40,#141c1f 68%)}
main{width:min(95vw,calc((100svh - 42px) * .75),495px)}
.viewport{position:relative;overflow:hidden;container-type:inline-size;border-radius:4px;border:1px solid #a49b7b65;background:#556975;box-shadow:0 18px 76px #080c11a8}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;outline-offset:-2px;touch-action:none}
.keys{display:flex;align-items:center;justify-content:space-between;min-height:32px;gap:6px;padding:4px 2px 0;font:11px system-ui,sans-serif;letter-spacing:.02em;color:#c9c8b6}
.kbd{text-align:center}
button{background:#253034;border:1px solid #aaa88c62;border-radius:4px;color:inherit;cursor:pointer;font:inherit;padding:3px 7px}
button:hover,button:focus-visible{background:#43524c}
button:focus-visible,canvas:focus-visible{outline:2px solid #f5d99b}
button:disabled{cursor:default;opacity:.48}
.touch{display:none;justify-content:space-between;gap:4px;padding:6px 0 0;color:#fff0d1}
.touch div{display:flex;gap:4px}
.touch button{min-width:44px;min-height:44px;touch-action:none;user-select:none;font:600 13px system-ui,sans-serif;background:#253034}
.touch .arrow{font-size:18px}
.conversation{position:absolute;inset:auto 3% 3%;padding:12px 14px 9px;padding:clamp(10px,3.4cqw,17px);background:#20262af5;border:1px solid #b49c7480;border-radius:5px;box-shadow:0 5px 22px #151716bf}
.conversation p{margin:0}
.conversation .speaker{color:#ddbb83;font:600 11px system-ui,sans-serif;letter-spacing:.045em;margin-bottom:.4em}
.conversation .line{font-size:16px;font-size:clamp(14px,4.05cqw,20px);line-height:1.35}
.conversation button{display:block;margin:.65em 0 0 auto;font:600 11px system-ui,sans-serif;padding:5px 8px}
.conversation kbd{margin-left:4px;color:#ddbb83}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(pointer:coarse){
  main{width:min(95vw,calc((100svh - 90px) * .75),495px)}
  .touch{display:flex}
  .keys .kbd,.conversation kbd{display:none}
  .conversation button{min-height:40px}
}
</style>
</head>
<body>
<main>
  <div class="viewport">
    <canvas id="game" width="720" height="960" tabindex="0" aria-label="Bounce Inferno, Limbo. Left and right roll. Space jumps. Down or S drops through marked ledges. E uses or talks. R restarts."></canvas>
    <section id="conversation" class="conversation" role="dialog" aria-label="Conversation" hidden>
      <div aria-live="polite" aria-atomic="true">
        <p id="speaker" class="speaker"></p>
        <p id="dialogue-line" class="line"></p>
      </div>
      <button id="advance" type="button"><span id="advance-label">Continue</span><kbd aria-hidden="true">E</kbd></button>
    </section>
  </div>
  <div class="touch" aria-label="Touch controls">
    <div>
      <button class="arrow" type="button" data-key="ArrowLeft" aria-label="Roll left">←</button>
      <button class="arrow" type="button" data-key="ArrowRight" aria-label="Roll right">→</button>
      <button class="arrow" type="button" data-key="ArrowDown" aria-label="Drop through a ledge">↓</button>
    </div>
    <div>
      <button type="button" id="touch-use" disabled>Use</button>
      <button type="button" data-key="Space">Jump</button>
    </div>
  </div>
  <div class="keys">
    <span id="location">I · Limbo</span>
    <span class="kbd">← → Roll · Space Jump · ↓ / S Drop · E Use</span>
    <div><button type="button" id="next-circle" hidden>Descend to Lust</button> <button type="button" id="restart">Restart</button></div>
  </div>
  <div id="interaction-status" class="visually-hidden" role="status"></div>
</main>
<script type="module">
import("./game.js").catch(error => {
  console.error(error);
  document.getElementById("location").textContent = "Could not load the circle. Reload the page.";
});
</script>
</body>
</html>
